name: Libass Patch Build

on:
  workflow_dispatch:
    inputs:
      avos_ref:
        description: Branch, tag, or commit to checkout in native/avos
        required: true
        default: libass-subtitles
      avos_repo:
        description: GitHub repo for native/avos, for example yourname/aos-avos. Leave blank to use this repo owner/aos-avos.
        required: false
        default: ""
      gradle_task:
        description: Gradle task to run from Video/
        required: true
        default: assembleNoamazonRelease
      enable_libass:
        description: Build Android libass prebuilts and export LIBASS=ON for the native build.
        required: true
        type: boolean
        default: true
  push:
    branches:
      - libass-subtitles
      - codex/libass-subtitles

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AVOS_REF: ${{ github.event.inputs.avos_ref || 'libass-subtitles' }}
      AVOS_REPO_INPUT: ${{ github.event.inputs.avos_repo }}
      GRADLE_TASK: ${{ github.event.inputs.gradle_task || 'assembleNoamazonRelease' }}
      ENABLE_LIBASS: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_libass) || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build packages
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip zip tar git pkg-config ca-certificates

      - name: Select hosted Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
            echo "Using Android NDK: ${ANDROID_NDK_LATEST_HOME}"
          else
            LATEST_NDK="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            echo "ANDROID_NDK_HOME=${LATEST_NDK}" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=${LATEST_NDK}" >> "$GITHUB_ENV"
            echo "Using Android NDK: ${LATEST_NDK}"
          fi

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-31" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Point submodules at upstream repos plus your patched aos-avos fork
        run: |
          AVOS_REPO="${AVOS_REPO_INPUT:-${GITHUB_REPOSITORY_OWNER}/aos-avos}"
          echo "Using native/avos repo: ${AVOS_REPO}"

          git submodule set-url Video https://github.com/nova-video-player/aos-Video.git
          git submodule set-url MediaLib https://github.com/nova-video-player/aos-MediaLib.git
          git submodule set-url FileCoreLibrary https://github.com/nova-video-player/aos-FileCoreLibrary.git
          git submodule set-url native/avos "https://github.com/${AVOS_REPO}.git"
          git submodule set-url native/audiocompress https://github.com/nova-video-player/aos-audiocompress.git
          git submodule set-url native/ffmpeg-android-builder https://github.com/nova-video-player/ffmpeg-android-builder-nobin.git
          git submodule set-url native/dav1d-android-builder https://github.com/nova-video-player/dav1d-android-builder-nobin.git
          git submodule set-url native/opus-android-builder https://github.com/nova-video-player/opus-android-builder-nobin.git
          git submodule set-url native/libmysofa-android-builder https://github.com/nova-video-player/libmysofa-android-builder.git
          git submodule set-url native/openssl-android-builder https://github.com/nova-video-player/openssl-android-builder-nobin.git
          git submodule set-url native/libyuv https://github.com/nova-video-player/aos-libyuv.git
          git submodule set-url native/libnativehelper https://github.com/nova-video-player/aos-libnativehelper.git
          git submodule set-url native/boost https://github.com/nova-video-player/aos-boost-android-builder.git
          git submodule set-url native/libtorrent-android-builder https://github.com/nova-video-player/aos-libtorrent-android-builder.git
          git submodule set-url native/torrentd https://github.com/nova-video-player/torrentd-nobin.git
          git submodule set-url native/prebuilt/ffmpeg https://github.com/nova-video-player/prebuilt-ffmpeg.git
          git submodule set-url native/prebuilt/opus https://github.com/nova-video-player/prebuilt-opus.git
          git submodule set-url native/prebuilt/dav1d https://github.com/nova-video-player/prebuilt-dav1d.git
          git submodule set-url native/prebuilt/openssl https://github.com/nova-video-player/prebuilt-openssl.git
          git submodule set-url native/prebuilt/libmysofa https://github.com/nova-video-player/prebuilt-libmysofa.git
          git submodule set-url native/prebuilt/torrentd https://github.com/nova-video-player/prebuilt-torrentd.git

          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Checkout patched native/avos ref
        run: |
          git -C native/avos fetch origin "${AVOS_REF}"
          git -C native/avos checkout FETCH_HEAD
          git -C native/avos log -1 --oneline
          git -C native/avos status --short

      - name: Build Android libass prebuilts
        if: env.ENABLE_LIBASS == 'true'
        run: |
          set -euo pipefail

          VCPKG_ROOT="${RUNNER_TEMP}/vcpkg"
          TRIPLET_DIR="${RUNNER_TEMP}/vcpkg-triplets"

          if [ ! -x "${VCPKG_ROOT}/vcpkg" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
            "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          fi

          mkdir -p "${TRIPLET_DIR}"

          create_android_triplet() {
            local triplet="$1"
            local arch="$2"
            local android_abi="$3"
            local make_host="$4"
            local neon="${5:-}"

            cat > "${TRIPLET_DIR}/${triplet}.cmake" <<EOF
          set(VCPKG_TARGET_ARCHITECTURE ${arch})
          set(VCPKG_CRT_LINKAGE static)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 23)
          set(VCPKG_MAKE_BUILD_TRIPLET "--host=${make_host}")
          set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=${android_abi})
          set(VCPKG_BUILD_TYPE release)
          EOF

            if [ "${neon}" = "ON" ]; then
              echo "set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=${android_abi} -DANDROID_ARM_NEON=ON)" >> "${TRIPLET_DIR}/${triplet}.cmake"
            fi
          }

          create_android_triplet nova-arm-neon-android arm armeabi-v7a armv7a-linux-androideabi ON
          create_android_triplet nova-arm64-android arm64 arm64-v8a aarch64-linux-android
          create_android_triplet nova-x86-android x86 x86 i686-linux-android
          create_android_triplet nova-x64-android x64 x86_64 x86_64-linux-android

          build_libass_for_abi() {
            local abi="$1"
            local triplet="$2"
            local src="${VCPKG_ROOT}/installed/${triplet}"
            local dst="${GITHUB_WORKSPACE}/native/prebuilt/libass/dist-${abi}"

            "${VCPKG_ROOT}/vcpkg" install "libass:${triplet}" \
              --overlay-triplets="${TRIPLET_DIR}" \
              --clean-after-build \
              --disable-metrics

            mkdir -p "${dst}/include" "${dst}/lib"
            cp -a "${src}/include/." "${dst}/include/"
            find "${src}/lib" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -a {} "${dst}/lib/" \;

            if [ ! -f "${dst}/lib/libass.so" ]; then
              echo "libass.so was not produced for ${abi} (${triplet})"
              find "${src}" -maxdepth 3 -type f | sort
              exit 1
            fi
          }

          build_libass_for_abi armeabi-v7a nova-arm-neon-android
          build_libass_for_abi arm64-v8a nova-arm64-android
          build_libass_for_abi x86 nova-x86-android
          build_libass_for_abi x86_64 nova-x64-android

          echo "Built libass prebuilts:"
          find native/prebuilt/libass -maxdepth 4 -type f -name "*.so*" | sort

          READ_ELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "DT_NEEDED for ${abi}/libass.so"
            "${READ_ELF}" -d "native/prebuilt/libass/dist-${abi}/lib/libass.so" | grep NEEDED || true
            for so in native/prebuilt/libass/dist-${abi}/lib/*.so*; do
              if "${READ_ELF}" -d "${so}" | grep -q "libc++_shared.so"; then
                echo "${so} depends on libc++_shared.so, but Nova packaging excludes that runtime"
                exit 1
              fi
            done
          done

      - name: Build Nova
        run: |
          set -o pipefail
          cd Video
          if [ "${ENABLE_LIBASS}" = "true" ]; then
            export LIBASS=ON
            echo "Building Nova with LIBASS=ON"
          else
            unset LIBASS
            echo "Building Nova with LIBASS disabled"
          fi
          ./gradlew --version
          ./gradlew "${GRADLE_TASK}" --stacktrace --warning-mode all 2>&1 | tee ../gradle-build.log

      - name: Self-sign unsigned release APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          KEYSTORE="${RUNNER_TEMP}/nova-test-signing.jks"
          SIGNED_DIR="${GITHUB_WORKSPACE}/signed-apks"

          mkdir -p "${SIGNED_DIR}"
          keytool -genkeypair \
            -keystore "${KEYSTORE}" \
            -storepass android \
            -keypass android \
            -alias nova-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nova Test,O=Codex,C=US"

          shopt -s globstar nullglob
          unsigned_apks=(Video/build/outputs/apk/**/*-unsigned.apk)
          if [ "${#unsigned_apks[@]}" -eq 0 ]; then
            echo "No unsigned APKs found to self-sign."
            exit 0
          fi

          for apk in "${unsigned_apks[@]}"; do
            name="$(basename "${apk}" .apk)"
            aligned="${RUNNER_TEMP}/${name}-aligned.apk"
            signed="${SIGNED_DIR}/${name}-selfsigned.apk"
            "${ZIPALIGN}" -p -f 4 "${apk}" "${aligned}"
            "${APKSIGNER}" sign \
              --ks "${KEYSTORE}" \
              --ks-key-alias nova-test \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "${signed}" \
              "${aligned}"
            "${APKSIGNER}" verify --verbose "${signed}"
          done

          ls -lh "${SIGNED_DIR}"

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-libass-patch-build
          if-no-files-found: warn
          path: |
            gradle-build.log
            signed-apks/**/*.apk
            Video/build/outputs/apk/**/*.apk
            Video/build/reports/**/*.html
            Video/build/reports/**/*.xml
